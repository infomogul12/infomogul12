name = "infomogul12"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "church-vote"
database_id = "90b6ee5c-d729-48f0-b3ec-20d40532afd4"
migrations_dir = "migrations"

[vars]
# 비밀 값(VOTE_PEPPER)은 여기에 쓰지 말고 대시보드의 Secrets에 넣는다.
SESSION_HOURS = "8"
